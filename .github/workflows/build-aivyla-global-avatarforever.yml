name: Aivyla Global AvatarForever - test image

# This file's first push starts the checked candidate build on this branch.
# Later source-only changes do not rebuild/deploy any endpoint automatically.
on:
  push:
    branches: [aivyla-global]
    paths: ['.github/workflows/build-aivyla-global-avatarforever.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aivyla-global-avatarforever
  cancel-in-progress: false

jobs:
  verify-and-build:
    if: github.ref == 'refs/heads/aivyla-global'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU checks before building
        run: |
          python -m py_compile aivyla_avatarforever.py aivyla_avatarforever_infer.py aivyla_avatarforever_env.py aivyla_avatarforever_smoke.py avatarforever_global_test.py aivyla_global_r2_handler.py
          python test_avatarforever.py
          python test_fast_start.py
          python test_global_r2.py
          python test_global_v3.py
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build isolated amd64 image with runtime import checks
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.global-avatarforever
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/kathanasiadis94/worker-aivyla:aivyla-global-avatarforever-ci-${{ github.run_number }}
      - name: Record candidate, do not deploy
        run: |
          echo 'IMAGE=ghcr.io/kathanasiadis94/worker-aivyla:aivyla-global-avatarforever-ci-${{ github.run_number }}'
          echo 'DIGEST=${{ steps.build.outputs.digest }}'
          echo 'Deploy only to Aivyla Global, then run avatarforever_global_test.py --check.'
          
