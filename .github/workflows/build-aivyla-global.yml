name: Build Aivyla Global (isolated)

on:
  workflow_dispatch:
  push:
    branches:
      - aivyla-global
    paths:
      - '.github/workflows/build-aivyla-global.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-global:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Regression tests are deliberately BEFORE the expensive Docker build.
      - name: Set up Python 3.12 for pre-build tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test startup idempotence, imports, and node-bundle recovery
        run: python -m unittest -v test_global_v3.py

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.global
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/kathanasiadis94/worker-aivyla:aivyla-global-v3
            ghcr.io/kathanasiadis94/worker-aivyla:aivyla-global-${{ github.run_number }}
