name: Build Aivyla Global R2 v4.2 (isolated)

# Isolated push trigger: uploading this NEW workflow to aivyla-global
# launches v4.2 checks and an image build. Old v3 and v4.1 tags are untouched.
on:
  push:
    branches:
      - aivyla-global
    paths:
      - '.github/workflows/build-aivyla-global-r2-v42.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aivyla-global-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build-r2:
    name: Tests first, then isolated R2 v4.2 image
    if: github.ref == 'refs/heads/aivyla-global'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout only selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Docker isolation and compile Python
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          d = Path('Dockerfile.global-r2').read_text()
          assert 'FROM ghcr.io/kathanasiadis94/worker-aivyla:aivyla-global-v3' in d, 'Unexpected R2 base image'
          assert 'CMD ["python", "/opt/aivyla-global/aivyla_global_r2_start.py"]' in d, 'Unexpected R2 startup'
          assert 'AIVYLA_R2_PRUNE_UNUSED=1' in d, 'Missing safe graph pruning configuration'
          assert 'AIVYLA_R2_SKIP_OBJECT_INFO=1' in d, 'Missing optional object_info skip'
          print('R2 v4.2 Docker isolation: PASS')
          PY
          python -m py_compile aivyla_r2_registry.py aivyla_r2_stage.py aivyla_r2_nodes.py aivyla_global_r2_handler.py aivyla_global_r2_start.py aivyla_global_nodes.py

      - name: R2 and Global v3 CPU regression tests
        run: |
          set -euo pipefail
          python test_global_r2.py
          python test_global_v3.py

      - name: Free build runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system df || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned R2 v4.2-only test image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.global-r2
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/kathanasiadis94/worker-aivyla:aivyla-global-r2-v4-2-${{ github.run_number }}

      - name: Print image digest and next steps
        run: |
          echo "R2 test image: ghcr.io/kathanasiadis94/worker-aivyla:aivyla-global-r2-v4-2-${{ github.run_number }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "No Runpod endpoint was updated. Global v3, R2 v4.1 and production are unchanged."
          # rebuild v4.2
