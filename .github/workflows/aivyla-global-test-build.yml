name: Aivyla Global Test Image

on:
  push:
    branches:
      - aivyla-global
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aivyla-global-test-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-build:
    name: Build and publish isolated test image
    if: github.ref == 'refs/heads/aivyla-global'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out exact aivyla-global commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify branch and build files
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/aivyla-global'
          test -f Dockerfile
          test -f handler.py
          python3 -m py_compile handler.py

      - name: Prepare image tag
        id: image
        shell: bash
        run: |
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repo}-global-test" >> "$GITHUB_OUTPUT"
          echo "tag=aivyla-global-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image (never production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            aivyla.environment=test
          provenance: false

      - name: Print exact immutable test image
        shell: bash
        run: |
          echo '### Aivyla Global test image' >> "$GITHUB_STEP_SUMMARY"
          echo 'No RunPod endpoint was updated.' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}' >> "$GITHUB_STEP_SUMMARY"
